# Nightly Release build — calls nightly.yml with assertions disabled
# (Release mode) by passing enable_assertions: false.

name: Nightly Release Build and Test

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number that requested this run'
        required: false
        type: number
        default: 0
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number that requested this run'
        required: false
        type: number
        default: 0
  pull_request:
    paths:
      - '.github/workflows/nightly-release.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

# Cancel in-progress runs for `pull_request` events only.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  request-nightly-release:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == 'check-nightly-release' &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - name: Dispatch nightly release workflow
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = context.issue.number;
            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
            });
            if (pullRequest.data.head.repo.full_name !== context.repo.full_name) {
              core.setFailed('Workflow dispatch is only supported for pull requests from this repository');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'nightly-release.yml',
              ref: context.payload.repository.default_branch,
              inputs: { pr_number: String(issueNumber) },
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: 'Dispatched `nightly-release.yml` for this pull request.',
            });

  nightly-release:
    uses: ./.github/workflows/nightly.yml
    with:
      enable_assertions: false
      pr_number: ${{ inputs.pr_number }}

  report-status:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pr_number != 0
    needs: nightly-release
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Report workflow result
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_STATUS: ${{ needs.nightly-release.result == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: [
                `Workflow \`${context.workflow}\` completed with status \`${process.env.RUN_STATUS}\`.`,
                `[View workflow run](${process.env.RUN_URL})`,
              ].join('\n\n'),
            });
