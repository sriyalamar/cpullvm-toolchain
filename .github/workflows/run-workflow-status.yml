name: Report Requested Workflow Status

on:
  workflow_run:
    workflows:
      - Linux Premerge Checks
      - Native Runtime Nightly Build and Test
      - Nightly Build and Test
      - Nightly Release Build and Test
      - Run libc++ tests
      - Zephyr Twister Tests
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    if: github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Report workflow result
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
        with:
          github-token: ${{ github.token }}
          script: |
            const run = JSON.parse(process.env.WORKFLOW_RUN);
            const headRepository = run.head_repository?.full_name || context.payload.repository.full_name;
            const [headOwner] = headRepository.split('/');

            const pullRequests = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${headOwner}:${run.head_branch}`,
              state: 'open',
              per_page: 100,
            });

            if (!pullRequests.data.length) {
              core.info(`No open pull request found for ${headRepository}:${run.head_branch}`);
              return;
            }

            const conclusion = run.conclusion || 'unknown';
            const marker = `<!-- run-workflow-status:${run.id} -->`;
            const body = [
              marker,
              `Workflow \`${run.name}\` completed with status \`${conclusion}\`.`,
              `Branch: \`${run.head_branch}\``,
              `[View workflow run](${run.html_url})`,
            ].join('\n\n');

            for (const pullRequest of pullRequests.data) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  per_page: 100,
                },
              );
              const existing = comments.find(comment => comment.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  body,
                });
              }
            }
