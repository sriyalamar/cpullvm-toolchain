name: Zephyr Twister Tests

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number that requested this run'
        required: false
        type: number
        default: 0
      run-id:
        description: >
          Run ID of a cpullvm-toolchain workflow that built the Linux x86_64 toolchain.
          Leave blank to use the latest nightly.
        required: false
        default: ''
      package-name:
        description: >
          Package name of the toolchain to download. Defaults to 'cpullvm-packages-build.sh-Linux-x86'.
          Only Linux packages should be used.
        required: false
        default: cpullvm-packages-build.sh-Linux-x86
  schedule:
    - cron: '0 5 * * 1' # Sunday 21:00 PST (Monday 05:00 UTC)
  pull_request:
    paths:
      - '.github/workflows/zephyr-twister-tests.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

# Cancel in-progress runs for `pull_request` events only.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  request-zephyr:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == 'check-zephyr' &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - name: Dispatch Zephyr workflow
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = context.issue.number;
            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issueNumber,
            });
            if (pullRequest.data.head.repo.full_name !== context.repo.full_name) {
              core.setFailed('Workflow dispatch is only supported for pull requests from this repository');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'zephyr-twister-tests.yml',
              ref: context.payload.repository.default_branch,
              inputs: { pr_number: String(issueNumber) },
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: 'Dispatched `zephyr-twister-tests.yml` for this pull request.',
            });

  resolve-pr:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve requested pull request
        id: resolve
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER || 0);
            if (!prNumber) {
              core.setOutput('pr_number', '');
              return;
            }

            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pullRequest.data.head.repo.full_name !== context.repo.full_name) {
              core.setFailed('Pull requests from external repositories are not supported');
              return;
            }
            core.setOutput('pr_number', String(prNumber));

  run-twister-tests:
    if: >-
      github.event_name != 'issue_comment' &&
      github.repository == 'qualcomm/cpullvm-toolchain' &&
      needs.resolve-pr.result == 'success'
    name: Twister tests for ${{ matrix.platform }} (${{ matrix.subset }}/2)
    needs: resolve-pr
    # Zephyr's tests take a relatively long time to complete but can be split to
    # run in parallel on different machines fairly easily (by platform/arch,
    # using `--subset`, etc.). So let's use Github's runners to avoid tying up
    # our (limited in number) self-hosted runners for hours at a time.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/zephyrproject-rtos/ci-base:main
      # Work around a mismatch between UIDs, see https://github.com/actions/checkout/issues/956
      options: '--user 0'

    strategy:
      fail-fast: false
      matrix:
        platform: [qemu_riscv32, qemu_riscv32_xip, qemu_riscv64, qemu_cortex_a53, qemu_cortex_m3, qemu_cortex_a9]
        subset: [1, 2]

    steps:
      - name: Clone Zephyr
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: zephyrproject-rtos/zephyr

      # We must also add the repository as a safe.directory, otherwise we get
      # errors about "dubious ownership". See https://github.com/actions/checkout/issues/2031
      - name: Set safe.directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout fetch-linux-toolchain action
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          sparse-checkout: .github/actions/fetch-linux-toolchain
          path: .cpullvm

      - name: Fetch toolchain
        uses: ./.cpullvm/.github/actions/fetch-linux-toolchain
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run-id }}
          package-name: ${{ inputs.package-name || 'cpullvm-packages-build.sh-Linux-x86' }}

      - name: West setup
        run: |
          west init -l .
          west update

      # Source hosttools (including qemu) from the Zephyr SDK.
      - name: Install Zephyr SDK hosttools
        run: |
          west sdk install --no-gnu-toolchains --install-base /opt/toolchains

      - name: Run Twister tests
        shell: bash
        run: |
          source zephyr-env.sh
          export ZEPHYR_SDK_INSTALL_DIR=/opt/toolchains/
          export ZEPHYR_TOOLCHAIN_VARIANT=host/llvm
          export LLVM_TOOLCHAIN_PATH=/opt/cpullvm/

          west twister -W \
            -p ${{ matrix.platform }} \
            -j 3 \
            --inline-logs \
            --force-toolchain \
            --subset ${{ matrix.subset }}/2 \
            -x=CONFIG_LLVM_USE_ELD=y \
            -x=CONFIG_COMPILER_RT_RTLIB=y

      - name: Upload Twister results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: zephyr-twister-test-results-${{ matrix.platform }}-subset-${{ matrix.subset }}
          path: |
            twister-out/twister.log
            twister-out/twister.xml
            twister-out/twister.json

  merge-twister-results:
    if: >-
      always() &&
      github.event_name != 'issue_comment' &&
      github.repository == 'qualcomm/cpullvm-toolchain' &&
      needs.resolve-pr.result == 'success'
    name: Merge Twister XML results
    needs: [resolve-pr, run-twister-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Download split XML results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: split_xml

      - name: Install junitparser
        run: |
          pip install junitparser

      - name: Merge split XML results
        run: |
          junitparser merge --glob "split_xml/**/twister.xml" merged_twister.xml

      - name: Upload merged XML results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: zephyr-merged-twister-test-results
          path: merged_twister.xml

  report-status:
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.pr_number != 0
    needs: [resolve-pr, run-twister-tests, merge-twister-results]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Report workflow result
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_STATUS: ${{ (needs.run-twister-tests.result == 'success' && needs.merge-twister-results.result == 'success') && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: [
                `Workflow \`${context.workflow}\` completed with status \`${process.env.RUN_STATUS}\`.`,
                `[View workflow run](${process.env.RUN_URL})`,
              ].join('\n\n'),
            });
