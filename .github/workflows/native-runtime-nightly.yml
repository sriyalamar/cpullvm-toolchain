# This workflow runs native Linux AArch64 build configurations in parallel.
# It is intended to be triggered as part of a **nightly build** to
# validate these configurations and test them automatically.
# It builds runtimes as part of the toolchain natively on Linux AArch64.

name: Native Runtime Nightly Build and Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-runtime-nightly.yml'
  schedule:
    - cron: '0 3 * * *'  # 7:00 PM PST (03:00 UTC)

permissions:
  contents: read

jobs:
  build-and-test:
    # Run on the upstream repository and the fork used to test this workflow.
    if: >-
      github.repository == 'qualcomm/cpullvm-toolchain' ||
      github.repository == 'sriyalamar/cpullvm-toolchain'
    name: ${{ matrix.build_script }} on ${{ matrix.target_os }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # FIXME: once we are able to source an up-to-date qemu in a reasonable
          # way, this should be changed to just an ordinary build.
          - build_script: build_no_qemu.sh
            test_script: test.sh
            install_script: install_dependencies.sh
            target_os: Linux-AArch64
            runner: ubuntu-24.04-arm

          # FIXME: convert to an ordinary build once we are able to source an
          # up-to-date QEMU. Similarly, the oridinary test script can't be used
          # as it references targets that don't exist with QEMU disabled. So
          # skip testing as well until we can re-enable QEMU. Little coverage
          # is lost in the meantime.
          - build_script: build_picolibc-v1812_overlay_no_qemu.sh
            test_script: ''
            install_script: install_dependencies.sh
            target_os: Linux-AArch64
            runner: ubuntu-24.04-arm

          - build_script: build_musl-embedded_overlay.sh
            test_script: ''
            install_script: ''
            target_os: Linux-AArch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # We build in the repository and rely on clean to cleanup possible
          # old build products if the runner doesn't do it itself.
          clean: true

      - name: Install dependencies
        if: matrix.install_script != ''
        run: ./qualcomm-software/scripts/${{ matrix.install_script }}

      - name: Apply llvm-project patches
        run: python3 qualcomm-software/cmake/patch_repo.py --method apply qualcomm-software/patches/llvm-project

      - name: Build
        run: ./qualcomm-software/scripts/${{ matrix.build_script }}

      - name: Upload built packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: success()
        with:
          name: cpullvm-packages-${{ matrix.build_script }}-${{ matrix.target_os }}
          path: |
            build*/cpullvm-*.tar.xz
            build*/cpullvm-*.zip
          retention-days: 7

      - name: Test
        if: matrix.test_script != ''
        run: ./qualcomm-software/scripts/${{ matrix.test_script }}

  report-status:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    steps:
      - name: Report workflow result
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RESULT: ${{ needs.build-and-test.result }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const conclusions = {
              success: 'success',
              failure: 'failure',
              cancelled: 'cancelled',
              skipped: 'skipped',
            };
            const conclusion = conclusions[process.env.RESULT] || 'failure';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Manual Workflow: Native Runtime Nightly',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion,
              details_url: process.env.RUN_URL,
              output: {
                title: `Workflow completed with ${conclusion}`,
                summary: `The native runtime workflow completed with ${process.env.RESULT}.`,
              },
            });
