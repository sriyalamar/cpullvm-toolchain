name: Run Workflow Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Print workflow context
        run: |
          echo "Workflow dispatch test started"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Run verification command
        run: |
          echo "The /run command successfully started this workflow."
          echo "The workflow completed its verification steps."

  report-status:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Report workflow result
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RESULT: ${{ needs.build-and-test.result }}
          HEAD_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const headOwner = context.repo.owner;
            const pullRequests = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${headOwner}:${process.env.HEAD_BRANCH}`,
              state: 'open',
              per_page: 100,
            });

            if (!pullRequests.data.length) {
              core.info(`No open pull request found for ${headOwner}:${process.env.HEAD_BRANCH}`);
              return;
            }

            const marker = `<!-- run-workflow-status:${process.env.RUN_ID} -->`;
            const body = [
              marker,
              `Workflow \`${context.workflow}\` completed with status \`${process.env.RESULT}\`.`,
              `Branch: \`${process.env.HEAD_BRANCH}\``,
              `[View workflow run](${process.env.RUN_URL})`,
            ].join('\n\n');

            for (const pullRequest of pullRequests.data) {
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  per_page: 100,
                },
              );
              const existing = comments.find(comment => comment.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  body,
                });
              }
            }
