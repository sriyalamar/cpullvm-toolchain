name: Run Workflow Test

on:
  workflow_dispatch:
    inputs:
      test_status:
        description: 'Test result to simulate'
        required: true
        type: choice
        options:
          - success
          - failure
          - cancel
        default: success

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Print workflow context
        run: |
          echo "Workflow dispatch test started"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Run verification command
        env:
          TEST_STATUS: ${{ inputs.test_status }}
        run: |
          echo "The /run command successfully started this workflow."
          echo "Requested test status: ${TEST_STATUS}"
          echo "Sleeping for 3 minutes so cancellation can be tested."
          sleep 180
          if [[ "${TEST_STATUS}" == "failure" ]]; then
            echo "Simulating a verification failure."
            exit 1
          fi
          echo "The workflow completed its verification steps."

  report-status:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    steps:
      - name: Report workflow result
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          RESULT: ${{ needs.build-and-test.result }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const conclusions = {
              success: 'success',
              failure: 'failure',
              cancelled: 'cancelled',
              skipped: 'skipped',
            };
            const conclusion = conclusions[process.env.RESULT] || 'failure';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Manual Workflow: Run Workflow Test',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion,
              details_url: process.env.RUN_URL,
              output: {
                title: `Workflow completed with ${conclusion}`,
                summary: `The simulated workflow result was ${process.env.RESULT}.`,
              },
            });
