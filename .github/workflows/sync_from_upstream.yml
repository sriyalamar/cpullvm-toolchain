# This workflow fetches changes from relevant branches from the
# llvm/llvm-project repository (upstream) into the corresponding branches
# in the qualcomm/cpullvm-toolchain repository (downstream), keeping them in sync.
name: Sync from Upstream LLVM
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
jobs:
  Fetch-Upstream:
    runs-on: ubuntu-24.04
    if: github.repository == 'qualcomm/cpullvm-toolchain' || github.repository == 'sriyalamar/cpullvm-toolchain'
    strategy:
      matrix:
        include:
          - branch: release/22.x
            stop_at_tag: llvmorg-22.1.4
    env:
      UPSTREAM_REMOTE: https://github.com/llvm/llvm-project.git
    steps:
      - name: Configure Access Token
        uses: actions/create-github-app-token@f45685208fd9b88321d74015b5996fc8c3e43d18 # v1.0.0
        id: generate-token
        with:
          app_id: ${{ secrets.SYNC_APP_ID }}
          private_key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ matrix.branch }}
          token: ${{ steps.generate-token.outputs.token }}
      - name: Configure Upstream Remote
        run: git remote add upstream ${{ env.UPSTREAM_REMOTE }}
      - name: Fetch and Push Upstream Changes
        run: |
          STOP_TAG="${{ matrix.stop_at_tag }}"
          if [ -n "$STOP_TAG" ]; then
            git fetch upstream ${{ matrix.branch }} --tags
            if git rev-parse "$STOP_TAG" > /dev/null 2>&1; then
              STOP_COMMIT=$(git rev-parse "${STOP_TAG}^{}")
              LOCAL_HEAD=$(git rev-parse HEAD)
              if [ "$LOCAL_HEAD" = "$STOP_COMMIT" ]; then
                echo "Already at $STOP_TAG, nothing to sync."
                exit 0
              fi
              git push origin "${STOP_COMMIT}:refs/heads/${{ matrix.branch }}"
            else
              echo "$STOP_TAG not yet tagged upstream, syncing normally."
              git pull --ff-only upstream ${{ matrix.branch }}
              git push origin ${{ matrix.branch }}
            fi
          else
            git pull --ff-only upstream ${{ matrix.branch }}
            git push origin ${{ matrix.branch }}
          fi
