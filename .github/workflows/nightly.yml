# This workflow runs our common build scripts in parallel for multiple operating
# systems and architectures. All runtimes are built on Linux x86_64 and copied to
# other build hosts.
#
# It is intended to be triggered as part of a **nightly build** to
# validate our typical build configurations and test them automatically.
#
# Other build configurations such as building the runtimes on non-Linux
# x86_64 platforms are built and tested separately.

name: Nightly Build and Test

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number that requested this run'
        type: number
        default: 0
      enable_assertions:
        description: 'Enable LLVM assertions'
        type: boolean
        default: true
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number that requested this run'
        type: number
        default: 0
      enable_assertions:
        description: 'Enable LLVM assertions'
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/nightly.yml'
  schedule:
    - cron: '0 23,11 * * *'
      timezone: 'America/Los_Angeles'
permissions:
  contents: read

# Cancel in-progress runs for `pull_request` events only.
concurrency:
  group: ${{ github.workflow }}-nightly-${{ github.head_ref || github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTRA_CMAKE_ARGS: ${{ format('{0}', inputs.enable_assertions) == 'false' && '-DLLVM_ENABLE_ASSERTIONS=OFF' || '-DLLVM_ENABLE_ASSERTIONS=ON' }}

jobs:
  resolve-pr:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      head_repo: ${{ steps.resolve.outputs.head_repo }}
      head_ref: ${{ steps.resolve.outputs.head_ref }}
    steps:
      - name: Resolve requested pull request
        id: resolve
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER || 0);
            if (!prNumber) {
              core.setOutput('head_repo', '');
              core.setOutput('head_ref', '');
              return;
            }

            const pullRequest = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pullRequest.data.head.repo.full_name !== context.repo.full_name) {
              core.setFailed('Pull requests from external repositories are not supported');
              return;
            }
            core.setOutput('head_repo', pullRequest.data.head.repo.full_name);
            core.setOutput('head_ref', pullRequest.data.head.ref);

  build-and-test-Linux-x86:
    # Don't run on forks
    if: github.repository == 'qualcomm/cpullvm-toolchain' && needs.resolve-pr.result == 'success'
    needs: resolve-pr
    name: build.sh on Linux-x86_64
    runs-on: cpullvm-ubuntu24-x86_64
    steps:
      - name: Checkout source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # We build in the repository and rely on clean to cleanup possible
          # old build products if the runner doesn't do it itself.
          clean: true
          repository: ${{ needs.resolve-pr.outputs.head_repo || github.repository }}
          ref: ${{ needs.resolve-pr.outputs.head_ref || github.ref }}

      - name: Apply llvm-project patches
        run: python3 qualcomm-software/cmake/patch_repo.py --method apply qualcomm-software/patches/llvm-project

      - name: Install dependencies
        run: ./qualcomm-software/scripts/install_dependencies_x86.sh

      - name: Build
        run: ./qualcomm-software/scripts/build.sh

      - name: Upload built packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: success()
        with:
          name: cpullvm-packages-build.sh-Linux-x86
          path: build*/cpullvm-*.tar.xz
          if-no-files-found: error
          retention-days: 7

      - name: Test
        run: ./qualcomm-software/scripts/test.sh

  build-and-test:
    if: github.repository == 'qualcomm/cpullvm-toolchain' && needs.resolve-pr.result == 'success'
    name: ${{ matrix.build_script }} on ${{ matrix.target_os }}
    needs: [resolve-pr, build-and-test-Linux-x86]
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - build_script: build_copy_runtimes.sh
            test_script: test.sh
            install_script: install_dependencies.sh
            target_os: Linux-AArch64
            runner: ubuntu-24.04-arm

          - build_script: build_picolibc-v1812_overlay.sh
            test_script: test_picolibc-v1812_overlay.sh
            install_script: install_dependencies_x86.sh
            target_os: Linux-x86_64
            runner: cpullvm-ubuntu24-x86_64

          - build_script: build_copy_runtimes.ps1
            test_script: test.ps1
            install_script: install_dependencies.ps1
            target_os: Windows-x86_64
            runner: windows-2025

          - build_script: build_copy_runtimes.ps1
            test_script: test.ps1
            install_script: install_dependencies.ps1
            target_os: Windows-AArch64
            runner: windows-11-arm

    steps:
      # Not setting these can cause lit test failures on Windows machines when
      # files with ex: different line endings are compared.
      - name: Preconfigure git
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - name: Checkout source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # We build in the repository and rely on clean to cleanup possible
          # old build products if the runner doesn't do it itself.
          clean: true
          repository: ${{ needs.resolve-pr.outputs.head_repo || github.repository }}
          ref: ${{ needs.resolve-pr.outputs.head_ref || github.ref }}

      - name: Download Linux-x86 package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cpullvm-packages-build.sh-Linux-x86

      - name: Install dependencies
        if: matrix.install_script != ''
        run: ./qualcomm-software/scripts/${{ matrix.install_script }}

      - name: Apply llvm-project patches
        run: python3 qualcomm-software/cmake/patch_repo.py --method apply qualcomm-software/patches/llvm-project

      - name: Build
        run: ./qualcomm-software/scripts/${{ matrix.build_script }}

      - name: Upload built packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: success()
        with:
          name: cpullvm-packages-${{ matrix.build_script }}-${{ matrix.target_os }}
          path: |
            build*/cpullvm-*.tar.xz
            build*/cpullvm-*.zip
            !build/cpullvm-*-Linux-x86_64*.tar.xz
          retention-days: 7

      - name: Test
        if: matrix.test_script != ''
        run: ./qualcomm-software/scripts/${{ matrix.test_script }}

  report-status:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pr_number != 0
    needs: [resolve-pr, build-and-test-Linux-x86, build-and-test]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Report workflow result
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          RUN_STATUS: ${{ (needs.build-and-test-Linux-x86.result == 'success' && needs.build-and-test.result == 'success') && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullRequest = Number(process.env.PR_NUMBER);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequest,
              body: [
                `Workflow \`${context.workflow}\` completed with status \`${process.env.RUN_STATUS}\`.`,
                `[View workflow run](${process.env.RUN_URL})`,
              ].join('\n\n'),
            });
